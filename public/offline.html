<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · HUMAN</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f4f0e8;
        color: #111;
        font-family: Archivo, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 2px solid #ff5d45;
        padding: 24px;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        margin: 0;
      }
      .tag {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ff5d45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">Offline</div>
      <h1>No connection.</h1>
      <p>
        Your run is not lost. Reconnect and reload — a run in progress picks up at the event you
        were on, and a finished run submits as soon as the network is back.
      </p>
    </div>
  </body>
</html>
